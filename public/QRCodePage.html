<!-- public/QRCodePage.html -->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <base href="/minuit-sonne-rouge/" />
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>QR Code - Minuit Sonne Rouge</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: #fff;
        color: #222;
        font-family: sans-serif;
        min-height: 100vh;
        width: 100vw;
        overflow-x: hidden;
        overflow-y: auto;
        box-sizing: border-box;
  padding: 1rem 1rem 2rem 1rem;
        display: block;
      }
      #qrcode {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <canvas id="qrcode"></canvas>
    <script>
      const params = new URLSearchParams(window.location.search);
      const custom = params.get("custom");
      if (custom) {
        // Display custom script roles
        fetch("roles-fr.json")
          .then((res) => res.json())
          .then((allRoles) => {
            // Remove QR code canvas if present
            const qr = document.getElementById("qrcode");
            if (qr) qr.remove();

            // Add title
            const h2 = document.createElement("h2");
            h2.textContent = "Script personnalisé";
            h2.style.fontSize = "2rem";
            h2.style.marginTop = "0rem";
            h2.style.marginBottom = "0rem";
            h2.style.textAlign = "center";
            h2.style.fontFamily = "'Pirata One', cursive";
            document.body.appendChild(h2);

            // Prepare role data
            const noms = custom.split(",").map(decodeURIComponent);
            const roles = noms
              .map((nom) => allRoles.find((r) => r.nom === nom))
              .filter(Boolean);
            const typeLabels = {
              Habitant: "Villageois",
              Étranger: "Étrangers",
              Acolyte: "Acolytes",
              Démon: "Démons",
            };
            const types = ["Villageois", "Étrangers", "Acolytes", "Démons"];
            const typeMap = {
              Villageois: ["Habitant", "Villageois"],
              Étrangers: ["Étranger", "Étrangers"],
              Acolytes: ["Acolyte", "Acolytes"],
              Démons: ["Démon", "Démons"],
            };

            // Container for all lists
            const allLists = document.createElement("div");
            allLists.id = "role-lists";
            allLists.style.maxWidth = "480px";
            allLists.style.margin = "0 auto";
            document.body.appendChild(allLists);

            function renderLists() {
              allLists.innerHTML = "";
              types.forEach((type) => {
                const rolesOfType = roles.filter((r) =>
                  typeMap[type].includes(r.type)
                );
                if (rolesOfType.length === 0) return;

                // Collapsible section container
                const section = document.createElement("div");
                //section.style.marginBottom = "1.2rem";
                section.style.paddingTop = "0.5rem";

                // Collapsible button
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = `▼  ${type}`;
                btn.setAttribute("aria-expanded", "true");
                btn.style.fontSize = "1.5rem";
                btn.style.fontWeight = "bold";
                btn.style.fontFamily = "'IM FELL ENGLISH SC', serif";
                btn.style.color =
                  type === "Démons" || type === "Acolytes"
                    ? "#950f13"
                    : "#0e74b4";
                btn.style.background = "none";
                btn.style.border = "none";
                btn.style.borderRadius = "0";
                btn.style.padding = "0.3em 0";
                btn.style.margin = "0 0 0rem 0";
                btn.style.boxShadow = "none";
                btn.style.cursor = "pointer";
                btn.style.display = "inline-block";
                // Trait noir sous le titre
                const underline = document.createElement("div");
                underline.style.width = "100%";
                underline.style.height = "0";
                underline.style.borderBottom = "1px solid #bbb";
                underline.style.margin = "0.15rem 0 0.15rem 0";

                // List container
                const list = document.createElement("div");
                list.style.width = "100%";
                list.style.maxWidth = "900px";
                list.style.marginLeft = "auto";
                list.style.marginRight = "auto";

                rolesOfType.forEach((role, idx) => {
                  // Container for icon and content
                  const row = document.createElement("div");
                  row.style.display = "flex";
                  row.style.alignItems = "center";
                  row.style.gap = "1.5rem";
                  row.style.background = "none";
                  row.style.color = "#222";
                  row.style.borderRadius = "0";
                  row.style.margin = "0";
                  row.style.padding = "0.7rem 0";
                  row.style.boxShadow = "none";

                  // Icon left
                  const iconCol = document.createElement("div");
                  iconCol.style.display = "flex";
                  iconCol.style.alignItems = "center";
                  iconCol.style.justifyContent = "center";
                  iconCol.style.flex = "0 0 56px";

                  const icon = document.createElement("img");
                  icon.src = `icons/icon_${normalizeNom(role.nom)}.png`;
                  icon.alt = role.nom;
                  icon.style.height = "48px";
                  icon.style.width = "48px";
                  icon.style.objectFit = "contain";
                  iconCol.appendChild(icon);
                  row.appendChild(iconCol);

                  // Content right (name above desc)
                  const contentCol = document.createElement("div");
                  contentCol.style.display = "flex";
                  contentCol.style.flexDirection = "column";
                  contentCol.style.alignItems = "flex-start";
                  contentCol.style.justifyContent = "flex-start";
                  contentCol.style.flex = "1 1 auto";

                  // Name above
                  const name = document.createElement("div");
                  name.textContent = role.nom;
                  name.style.fontWeight = "bold";
                  name.style.fontSize = "1.25rem";
                  name.style.color = role.alignement === "Bon" ? "#0e74b4" : "#950f13";
                  name.style.textAlign = "left";
                  name.style.fontFamily = "'IM Fell English SC', serif";
                  name.style.margin = "0 0 0.2rem 0";
                  contentCol.appendChild(name);

                  // Description below
                  const desc = document.createElement("div");
                  const pouvoir = role.pouvoir || "";
                  desc.innerHTML = pouvoir.replace(/(\[[^\]]+\])/g, "<strong>$1</strong>");
                  desc.style.fontSize = "1rem";
                  desc.style.lineHeight = "1.2";
                  desc.style.textAlign = "left";
                  desc.style.fontFamily = "Cardo, serif";
                  contentCol.appendChild(desc);

                  row.appendChild(contentCol);
                  list.appendChild(row);
                  // Add a thin gray separator after each role except the last
                  if (idx < rolesOfType.length - 1) {
                    const separator = document.createElement("div");
                    separator.style.width = "100%";
                    separator.style.height = "0";
                    separator.style.borderBottom = "1px solid #bbb";
                    separator.style.margin = "0.15rem 0 0.15rem 0";
                    list.appendChild(separator);
                  }
                });

                // Collapsible logic
                btn.addEventListener("click", function () {
                  if (list.style.display === "none") {
                    list.style.display = "";
                    btn.textContent = `▼  ${type}`;
                    btn.setAttribute("aria-expanded", "true");
                  } else {
                    list.style.display = "none";
                    btn.textContent = `►  ${type}`;
                    btn.setAttribute("aria-expanded", "false");
                  }
                });

                section.appendChild(btn);
                section.appendChild(underline);
                section.appendChild(list);
                allLists.appendChild(section);
              });
            }

            // Initial render
            renderLists();
          });
        function normalizeNom(nom) {
          return nom
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/[^a-zA-Z0-9]/g, "")
            .toLowerCase();
        }
      } else {
        const edition = params.get("edition");
        const links = {
          "Sombre présage": "assets/Minuitsonnerouge_Sombrepresage.pdf",
          "Parfum d’hystérie": "assets/Minuitsonnerouge_Parfumdhysterie.pdf",
          "Crépuscule funeste": "assets/Minuitsonnerouge_Crepusculefuneste.pdf",
        };
        const url = links[edition];
        if (url) {
          QRCode.toCanvas(
            document.getElementById("qrcode"),
            new URL(url, document.baseURI).href
          );
        } else {
          document.body.innerHTML = "<p>Édition inconnue.</p>";
        }
      }
    </script>
  </body>
</html>
